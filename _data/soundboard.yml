# TTRPG Soundboard configuration
# Add sounds to assets/sounds/ and reference them here.
# loop: true  → tile toggles on/off, can layer with other loops
# loop: false → tile plays once per click
# type: ambient | music | oneshot  → controls which volume slider affects this category

- category: Ambience
  type: ambient
  sounds:
    - name: Synth loop
      file: Alien_Starship-synth_tone_loop.mp3
      loop: true
    - name: Metal drip
      file: Alien_Starship-drips_metal_loop.mp3
      loop: true

- category: Music
  type: music
  sounds:
    - name: Wake up jazz
      file: lofi jazz.mp3
      loop: true

- category: Combat
  type: ambient
  sounds:
    - name: Battle Drums
      file: battle_drums.mp3
      loop: true

- category: Events
  type: oneshot
  sounds:
    - name: Door Open
      file: Alien_Starship-door_open.mp3
      loop: false
    - name: Elevator broken
      file: machine whirring up then stopping.mp3
      loop: false

- category: Cassettes
  type: oneshot
  sounds:
    - name: Yellow Cassette
      file: mothership_yellow_cassette.mp3
      loop: false
    - name: Blue Cassette
      file: mothership_blue_cassette.mp3
      loop: false
    - name: White Cassette
      file: mothership_white_cassette.mp3
      loop: false
